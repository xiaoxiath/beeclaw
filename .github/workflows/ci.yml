name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Node 24+ — vitest spawns Node for the test runner, and a
      # handful of test files use the built-in `node:sqlite` module
      # (added in Node 22.5+, stabilized in 24) for real-SQL coverage
      # without mocks. Node 20, the setup-bun default, has no node:sqlite
      # and would fail those tests with "No such built-in module".
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type Check
        run: bun run typecheck

      # Config schema drift guard. The Zod schema in
      # src/infra/config/schema.ts is the single source of truth;
      # beeclaw.schema.json is generated for editor autocompletion.
      # Regen + diff catches PRs that change Zod without running
      # `bun run gen:config-schema`.
      - name: Config Schema Drift Guard
        run: |
          bun run gen:config-schema
          git diff --exit-code beeclaw.schema.json || (
            echo "❌ beeclaw.schema.json is out of sync with the Zod source."
            echo "   Run \`bun run gen:config-schema\` locally and commit the result."
            exit 1
          )

      - name: Test
        run: bun run test:ci

      # Coverage gate. Thresholds live in vitest.config.ts under
      # `test.coverage.thresholds` — vitest exits non-zero if any
      # bucket falls below its floor. Floors are deliberately set
      # ~5pt below current actual (90% lines / 82% branches) to
      # catch regressions without false-failing on refactor noise.
      - name: Coverage Gate
        run: bun run test:coverage

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web UI
        run: bun run build:web
