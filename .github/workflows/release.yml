name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            suffix: ''
          - target: linux-arm64
            runner: ubuntu-latest
            suffix: ''
          - target: macos-arm64
            runner: macos-latest
            suffix: ''
          - target: macos-x64
            runner: macos-13
            suffix: ''
          - target: windows-x64
            runner: windows-latest
            suffix: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Web UI
        run: bun run build:web

      - name: Build CLI binary
        run: |
          bun build --compile --target=bun-${{ matrix.target }} ./src/entries/cli.ts --outfile beeclaw${{ matrix.suffix }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beeclaw-${{ matrix.target }}
          path: beeclaw${{ matrix.suffix }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/beeclaw-*; do
            target=$(basename "$dir" | sed 's/beeclaw-//')
            if [ "$target" = "windows-x64" ]; then
              cp "$dir/beeclaw.exe" "release-assets/beeclaw-${{ github.ref_name }}-${target}.exe"
            else
              cp "$dir/beeclaw" "release-assets/beeclaw-${{ github.ref_name }}-${target}"
              chmod +x "release-assets/beeclaw-${{ github.ref_name }}-${target}"
            fi
          done
          ls -la release-assets/

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

          # Generate changelog
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi

          # Write changelog to file for multiline output
          {
            echo "## What's Changed"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
          } > RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Beeclaw ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
